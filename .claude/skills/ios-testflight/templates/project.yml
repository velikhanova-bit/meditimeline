name: {{APP_NAME}}
options:
  bundleIdPrefix: {{BUNDLE_PREFIX}}
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: {{APP_NAME}}
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        INFOPLIST_KEY_CFBundleDisplayName: "{{DISPLAY_NAME}}"
        INFOPLIST_KEY_LSApplicationCategoryType: "{{CATEGORY}}"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: "{{TEAM_ID}}"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# ─── PLACEHOLDERS ────────────────────────────────────────────────────────────
# {{APP_NAME}}      — CamelCase, e.g. MeditationApp
# {{BUNDLE_PREFIX}} — e.g. com.yourname
# {{BUNDLE_ID}}     — e.g. com.yourname.meditationapp
# {{DISPLAY_NAME}}  — e.g. "Meditation App"
# {{CATEGORY}}      — public.app-category.lifestyle | .health-fitness | .entertainment | .education
# {{TEAM_ID}}       — 10-char Apple Developer Team ID (developer.apple.com → Membership)
